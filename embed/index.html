<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ZERA ICT GUY :)</title>
    <meta name="description" content="Scheme of work, timetable and lesson plans." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>" />
    <style>
      :root {
        color-scheme: light dark;
        --page-bg: #f6f7f9;
        --page-fg: #5d6675;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page-bg: #0d1117;
          --page-fg: #98a3b3;
        }
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--page-bg);
        overflow: hidden;
      }
      /* Fills the viewport on desktop and mobile; dvh keeps mobile browser
         toolbars from cropping the bottom navigation. */
      #app {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        border: 0;
        display: block;
      }
      #fallback {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        font: 15px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        color: var(--page-fg);
        text-align: center;
        pointer-events: none;
      }
      #fallback a {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <!-- Shown underneath the frame; visible only if the frame fails to paint. -->
    <div id="fallback">
      <p>
        Loading the dashboard…<br />
        <a href="https://zera-ict.vercel.app/" target="_blank" rel="noopener">Open it in a new tab</a>
      </p>
    </div>

    <iframe
      id="app"
      src="https://zera-ict.vercel.app/"
      title="Zera ICT Lesson Dashboard"
      allow="clipboard-write; fullscreen; screen-wake-lock; publickey-credentials-get"
      referrerpolicy="strict-origin-when-cross-origin"
      loading="eager"
    ></iframe>
  </body>
</html>
